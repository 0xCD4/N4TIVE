plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ctf.nativectf'
    compileSdk 34
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.ctf.nativectf"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.1"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        debug {
            // Level 0: symbols present, debuggable
            debuggable true
            jniDebuggable true
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    cFlags "-g -O0 -DDEBUG_BUILD=1"
                }
            }
        }
        release {
            // Level 1: -O2, hidden visibility, symbols stripped, not debuggable
            debuggable false
            jniDebuggable false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // The repository holds no release key. The debug key makes
            // assembleRelease produce an APK that installs.
            signingConfig signingConfigs.debug
            externalNativeBuild {
                cmake {
                    cFlags "-O2 -DNDEBUG -fvisibility=hidden"
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

androidComponents {
    // Only the debug build keeps the symbols of its libraries.
    // The release build is stripped when it is packaged.
    onVariants(selector().withBuildType("debug")) { variant ->
        variant.packaging.jniLibs.keepDebugSymbols.add("**/*.so")
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
